ه و تأیید (OK) نمایید.\nپس از دانلود اپلیکیشن فیلم‌نت، آن را نصب و اجرا کنید.\n\nتوجه: اگر پس از دانلود، مراحل نصب نمایش داده نشد، لازم است از قسمت تنظیمات، دسترسی نصب به برنامه Downloader را فعال کنید و سپس دوباره مراحل نصب فیلم‌نت را انجام دهید.\n&quot;,&quot;label&quot;:&quot;خطای (نسخه نصب شده روی دستگاه شما دیگر پشتیبانی نمیشود.لطفا برنامه را بروز رسانی کنید)&quot;},{&quot;act&quot;:&quot;showMessage&quot;,&quot;data&quot;:&quot;کاربر گرامی این مورد به دلیل تلاش مجدد جهت انجام عملیات ورود در بازه زمانی کوتاه میباشد،جهت رفع این مورد لطفا اینترنت مصرفی خودرا تغییر دهید (برای مثال میتوانید از اینترنت خط موبایل استفاده بفرمایید) سپس بعداز گذشت 5 دقیقه مجدد جهت ورود اقدام نمایید.\nقابل ذکر است پس از انجام عملیات ورود میتوانید به اینترنت قبلی متصل شوید.&quot;,&quot;label&quot;:&quot;خطای تعداد درخواست بیش از حد مجاز&quot;},{&quot;act&quot;:&quot;showMessage&quot;,&quot;data&quot;:&quot;لطفا از طریق اپلیکیشن و یا سایت عملیات ورود و ثبت‌نام را انجام داده، سپس وارد بخش خرید اشتراک شده و بسته ی مورد نظر خود را خریداری بفرمایید، پس از فعال شدن اشتراک شما میتوانید از محتوای درون برنامه استفاده نمایید.&quot;,&quot;label&quot;:&quot;نحوه خرید اشتراک&quot;},{&quot;act&quot;:&quot;showMessage&quot;,&quot;data&quot;:&quot;کاربر گرامی با شماره همراه خود وارد سایت filmnet.ir شده، خریداشتراک را انتخاب نمایید و سپس در صفحه خرید اشتراک کد تخفیف را  در کادر مخصوص&amp;quot; کدتخفیف/کد هدیه&amp;quot; وارد کنید.لطفا به علامت خط فاصله  توجه بفرمایید.سپس گزینه اعمال را بزنید ، پس از اعمال موفق کدتخفیف ،لطفا به بخش اشتراک ها مراجعه و اشتراک مورد نظر خود را انتخاب فرمایید.&quot;,&quot;label&quot;:&quot;نحوه فعالسازی کدتخفیف و کد هدیه&quot;},{&quot;act&quot;:&quot;showMessage&quot;,&quot;data&quot;:&quot;کاربر گرامی،شما میتوانید به صورت هم‌زمان از ۳ دستگاه (تلویزیون، کامپیوتر، گوشی یا تبلت) با یک شماره اشتراک استفاده بفرمایید&quot;,&quot;label&quot;:&quot;با چند دستگاه میتوان از یک اشتراک استفاده کرد؟&quot;},{&quot;act&quot;:&quot;showMessage&quot;,&quot;data&quot;:&quot;کاربرگرامی لطفا در د
